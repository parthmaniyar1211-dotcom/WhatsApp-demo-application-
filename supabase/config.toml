# Supabase CLI config. Used by `supabase start` (local stack) and `supabase functions deploy`.
# Hosted-project auth settings are NOT changed by this file unless you run `supabase config push`.
project_id = "whatsapp-shared-inbox"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
jwt_expiry = 3600
# No public signup: staff accounts are created only by the admin-staff function.
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Meta calls the webhook without a Supabase JWT; it is protected by X-Hub-Signature-256 instead.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.send-whatsapp]
verify_jwt = true

[functions.admin-staff]
verify_jwt = true

[functions.mark-read]
verify_jwt = true
